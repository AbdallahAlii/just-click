{% extends "_base.html" %}
{% block title %}Reply from JustClick{% endblock %}
{% block heading %}Reply from JustClick{% endblock %}
{% block body %}
  <p style="margin:0 0 16px;font-size:16px;line-height:1.7;">Hello {{ name }},</p>
  <p style="margin:0 0 20px;font-size:15px;line-height:1.7;color:#334155;">
    Thank you for contacting JustClick about <strong>{{ subject }}</strong>.
  </p>
  <div style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:18px 20px;margin-bottom:24px;">
    <p style="margin:0;font-size:15px;line-height:1.7;white-space:pre-wrap;">{{ admin_reply }}</p>
  </div>
  <p style="margin:0;font-size:15px;line-height:1.7;">Best regards,<br/>The JustClick team</p>
{% endblock %}
