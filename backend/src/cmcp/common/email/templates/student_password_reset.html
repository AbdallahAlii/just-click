<!doctype html>
<html lang="en">
  <body style="margin:0;padding:0;background:#f4f6f8;font-family:Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:#1f2937;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f4f6f8;padding:24px 12px;">
      <tr>
        <td align="center">
          <table role="presentation" width="600" cellspacing="0" cellpadding="0" style="max-width:600px;width:100%;background:#ffffff;border-radius:12px;overflow:hidden;">
            <tr>
              <td style="background:#0f766e;padding:24px 28px;">
                <h1 style="margin:0;color:#fff;font-size:22px;">Password reset</h1>
              </td>
            </tr>
            <tr>
              <td style="padding:28px;">
                <p>Hello {{ full_name }},</p>
                <p>Your administrator reset your portal password.</p>
                <p><strong>Username:</strong> {{ username }}</p>
                <p><strong>Student ID:</strong> {{ student_id }}</p>
                <p><strong>Temporary password:</strong> {{ temp_password }}</p>
                <p><a href="{{ login_link }}">Login here</a></p>
                <p>This temporary password expires in {{ expires_hours }} hours. You must change it after login.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
