<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}JustClick{% endblock %}</title>
  </head>
  <body style="margin:0;padding:0;background:#f4f6f8;font-family:Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:#1f2937;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f4f6f8;padding:28px 12px;">
      <tr>
        <td align="center">
          <table role="presentation" width="600" cellspacing="0" cellpadding="0" style="max-width:600px;width:100%;background:#ffffff;border-radius:16px;overflow:hidden;box-shadow:0 8px 24px rgba(15,118,110,0.08);">
            <tr>
              <td style="background:linear-gradient(135deg,#0f766e,#0d9488);padding:28px 32px;">
                <p style="margin:0;color:#ccfbf1;font-size:12px;letter-spacing:0.12em;text-transform:uppercase;font-weight:600;">JustClick · Learning portal</p>
                <h1 style="margin:10px 0 0;color:#ffffff;font-size:26px;line-height:1.3;font-weight:700;">{% block heading %}{% endblock %}</h1>
              </td>
            </tr>
            <tr>
              <td style="padding:32px;">
                {% block body %}{% endblock %}
              </td>
            </tr>
            <tr>
              <td style="padding:20px 32px;background:#f8fafc;border-top:1px solid #e2e8f0;">
                <p style="margin:0 0 4px;font-size:13px;color:#0f766e;font-weight:600;">JustClick</p>
                <p style="margin:0;font-size:12px;color:#94a3b8;line-height:1.6;">
                  Your university materials, organized for study.
                  {% block footer_extra %}{% endblock %}
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
