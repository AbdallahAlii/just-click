{% extends "_base.html" %}
{% block title %}New Contact Us message{% endblock %}
{% block heading %}New Contact Us message{% endblock %}
{% block body %}
  <p style="margin:0 0 16px;font-size:15px;line-height:1.7;"><strong>From:</strong> {{ name }} &lt;{{ email }}&gt;</p>
  <p style="margin:0 0 8px;font-size:15px;"><strong>Subject:</strong> {{ subject }}</p>
  <p style="margin:0 0 8px;font-size:15px;"><strong>Reference:</strong> #{{ contact_id }}</p>
  <p style="margin:0 0 20px;font-size:15px;"><strong>Received:</strong> {{ created_at }}</p>
  <div style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:18px 20px;">
    <p style="margin:0;font-size:15px;line-height:1.7;white-space:pre-wrap;">{{ message }}</p>
  </div>
{% endblock %}
